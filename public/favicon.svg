<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Slate Background and Crimson Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pulseBg)" stroke="#e11d48" stroke-width="2" />

  <!-- Outer Flame Badge with Glow -->
  <g filter="url(#glow)">
    <!-- Stylized Pulse / Flame Core -->
    <path
      d="M32 10 
         C34 16, 42 20, 42 28 
         C42 34, 38 38, 38 41 
         C43 38, 46 32, 46 27 
         C46 38, 39 49, 32 53 
         C25 49, 18 38, 18 27 
         C18 32, 21 38, 26 41 
         C26 38, 22 34, 22 28 
         C22 20, 30 16, 32 10 Z"
      fill="url(#flameGrad)"
    />

    <!-- Inner Core Flame Highlight -->
    <path
      d="M32 24
         C33.5 28, 38 30.5, 38 35.5
         C38 39, 35.5 42, 35.5 44
         C38 42, 40 38, 40 35
         C40 42, 35.5 48, 32 50
         C28.5 48, 24 42, 24 35
         C24 38, 26 42, 28.5 44
         C28.5 42, 26 39, 26 35.5
         C26 30.5, 30.5 28, 32 24 Z"
      fill="url(#innerGlow)"
      opacity="0.95"
    />

    <!-- Pulse ECG Line Accent Across Bottom of Badge -->
    <path
      d="M12 43 L22 43 L25 38 L29 48 L33 40 L36 45 L39 43 L52 43"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />
  </g>
</svg>